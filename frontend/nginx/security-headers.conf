# Security headers added to every response. They live in their own file because nginx does NOT inherit
# add_header lines into a location that defines its own add_header, so each location includes this file.
add_header X-Content-Type-Options "nosniff" always;                       # browsers must not guess a file's type
add_header X-Frame-Options "DENY" always;                                 # nobody may embed the site in a frame (clickjacking)
add_header Referrer-Policy "strict-origin-when-cross-origin" always;      # do not leak full URLs to other sites
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always; # the app needs none of these features
