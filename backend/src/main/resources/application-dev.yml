# Local development only: sample data (db/dev migrations), the H2 console and throwaway credentials.
# These values are public in the repository, so they must never be used outside a developer machine.
spring:
  flyway:
    locations: classpath:db/migration,classpath:db/dev
  h2:
    console:
      enabled: true
      path: /h2-console

springdoc:
  # OpenAPI document at /v3/api-docs and Swagger UI at /swagger-ui.html
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

app:
  security:
    jwt:
      secret: dev-only-signing-key-change-me-0123456789
    bootstrap-admin:
      username: admin
      password: admin12345
