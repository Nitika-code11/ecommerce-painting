spring:
  application:
    name: painting-ecommerce
  profiles:
    # `mvn spring-boot:run` works out of the box; override with SPRING_PROFILES_ACTIVE.
    default: dev
  datasource:
    url: jdbc:h2:mem:paintingdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that the entities match it.
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

server:
  port: 8080
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  cors:
    # Comma-separated list of browser origins allowed to call /api/**.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
